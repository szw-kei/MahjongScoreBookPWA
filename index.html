<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#174c3c"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="麻雀成績帳"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/icon-192.png"><link rel="stylesheet" href="styles.css"><title>麻雀成績帳</title></head><body><header class="app-header"><h1>麻雀成績帳</h1><button id="settingsBtn" class="icon-btn">⚙️</button></header><main id="app" class="app-main"></main><dialog id="settingsDialog"><div class="dialog-head"><h2>設定</h2><button id="closeSettings" class="icon-btn">✕</button></div><label class="setting-row"><span>会社モード</span><input id="companyModeToggle" type="checkbox"></label><label class="setting-row column"><span>収支倍率</span><input id="rateInput" type="number" inputmode="decimal" min="0" step="1" value="50"></label><button id="resetBtn" class="danger-btn">データをリセット</button></dialog><dialog id="calculatorDialog"><div class="calc-dialog"><div id="calcValue" class="calc-value">0</div><div class="calc-grid"><button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button><button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button><button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button><button data-key="minus">−</button><button data-key="0">0</button><button data-key="back">⌫</button><button data-key="clear" class="clear-key">C</button><button data-key="ok" class="ok-key">✓</button></div></div></dialog><script src="app.js"></script></body></html>
